<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ETHIO GAMING ZONE 3D Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;font-family:Arial;touch-action:none}canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;inset:0;color:white;pointer-events:none}.brand{position:absolute;top:14px;left:14px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px #000}.brand b{color:#ffd54a}.stats{position:absolute;right:14px;top:14px;text-align:right;font-weight:bold;text-shadow:0 2px 8px #000}
#message{pointer-events:auto;position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:min(90vw,430px);text-align:center;padding:22px;border:1px solid #ffffff55;border-radius:20px;background:#071827eF;box-shadow:0 15px 50px #0009}h1{color:#ffd54a;margin:0 0 8px}p{line-height:1.5;color:#e2f6ff;font-size:14px}button{border:0;border-radius:13px;padding:13px 26px;background:linear-gradient(#ffe77c,#ffb900);font-weight:900;font-size:17px}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}.pad{display:flex;gap:14px}.ctrl{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:2px solid #ffffff9c;background:#07182799;color:white;font-size:27px;font-weight:bold;display:grid;place-items:center;user-select:none}.ctrl.down,.ctrl:active{background:#ffbf28;color:#111}#nitro{width:78px;border-radius:20px;background:linear-gradient(#8af2ff,#16a9d1);color:#081b27;font-size:13px}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="brand">ETHIO <b>GAMING ZONE</b></div><div class="stats">SCORE: <span id="score">0</span><br><small>BEST: <span id="best">0</span>　 SPEED: <span id="speed">0</span></small></div><div id="message"><h1>3D RACING</h1><p>Race on the highway, avoid traffic and beat your best score!<br>Use ◀ ▶ or touch buttons. Hold NITRO to boost.</p><button id="start">START RACE</button></div></div><div id="controls"><div class="pad"><div class="ctrl" id="left">◀</div><div class="ctrl" id="right">▶</div></div><div class="ctrl" id="nitro">NITRO</div></div>
<script>
(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D,run=false,score=0,best=+(localStorage.etgBest||0),speed=70,x=0,frame=0,spawn=0,traffic=[],curve=0,target=0,nitro=0,shake=0; $('best').textContent=best;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}onresize=size;size();
function poly(p,col){g.fillStyle=col;g.beginPath();g.moveTo(...p[0]);p.slice(1).forEach(q=>g.lineTo(...q));g.closePath();g.fill()}
function road(t){let y=H*.34+t*H*.66,half=W*(.08+.4*t),mid=W/2+Math.sin(frame*.003)*W*.025*t+curve*t*t*W*.13;return{y,half,mid}}
function car(px,py,w,h,col){g.save();g.translate(px,py);g.fillStyle='#0008';g.beginPath();g.ellipse(0,h*.4,w*.7,h*.15,0,0,7);g.fill();g.fillStyle='#080d12';[-1,1].forEach(a=>[-1,1].forEach(b=>g.fillRect(a*w*.4-w*.09,b*h*.2-h*.09,w*.18,h*.22)));let gr=g.createLinearGradient(-w/2,0,w/2,0);gr.addColorStop(0,'#101820');gr.addColorStop(.3,col);gr.addColorStop(.8,col);gr.addColorStop(1,'#101820');poly([[-w*.4,h*.35],[-w*.48,0],[-w*.3,-h*.4],[-w*.2,-h*.5],[w*.2,-h*.5],[w*.3,-h*.4],[w*.48,0],[w*.4,h*.35]],gr);poly([[-w*.28,-h*.2],[-w*.18,-h*.42],[w*.18,-h*.42],[w*.28,-h*.2],[w*.24,0],[-w*.24,0]],'#17374b');poly([[-w*.25,h*.05],[w*.25,h*.05],[w*.3,h*.25],[-w*.3,h*.25]],'#21475b');g.fillStyle='#fff3a6';g.fillRect(-w*.34,h*.25,w*.15,h*.06);g.fillRect(w*.19,h*.25,w*.15,h*.06);g.restore()}
function scenery(){let sky=g.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#071b35');sky.addColorStop(.6,'#27728a');sky.addColorStop(1,'#f6a66a');g.fillStyle=sky;g.fillRect(0,0,W,H*.55);poly([[0,H*.44],[W*.16,H*.25],[W*.3,H*.42],[W*.48,H*.2],[W*.68,H*.42],[W*.84,H*.26],[W,H*.42],[W,H*.55],[0,H*.55]],'#23495b');g.fillStyle='#28613d';g.fillRect(0,H*.43,W,H*.57);
for(let i=0;i<18;i++){let t=(i/18+frame*.0008)%1,y=H*.34+t*t*H*.72,xx=W/2+(i%2?1:-1)*(W*.12+t*W*.44),s=7+t*33;poly([[xx,y-s*2],[xx-s,y+s],[xx+s,y+s]],'#12352b');g.fillStyle='#68452b';g.fillRect(xx-s*.1,y+s*.4,s*.2,s*.7)}}
function drawRoad(){for(let i=0;i<44;i++){let t=i/44,u=(i+1)/44,a=road(t),b=road(u),alt=(i+Math.floor(frame*.07))%2===0;poly([[a.mid-a.half*1.13,a.y],[a.mid+a.half*1.13,a.y],[b.mid+b.half*1.13,b.y],[b.mid-b.half*1.13,b.y]],alt?'#eee8d9':'#c7c1b5');poly([[a.mid-a.half,a.y],[a.mid+a.half,a.y],[b.mid+b.half,b.y],[b.mid-b.half,b.y]],alt?'#303941':'#39434b');for(let lane=1;lane<3;lane++){let ax=a.mid-a.half+2*a.half*lane/3,bx=b.mid-b.half+2*b.half*lane/3;if((Math.floor(i/2+frame*.1)%2)===0)poly([[ax-1,a.y],[ax+1,a.y],[bx+2.5,b.y],[bx-2.5,b.y]],'#f5f1dc')}}}
function spawnCar(){traffic.push({lane:[-.66,0,.66][Math.floor(Math.random()*3)],z:0,v:.003+Math.random()*.0015,col:['#ffb52e','#37c8e9','#e94c55','#dce8ee'][Math.floor(Math.random()*4)]})}
function start(){score=0;speed=70;x=0;traffic=[];spawn=0;run=true;$('message').style.display='none';$('score').textContent=0}
$('start').onclick=start;
function update(){if(!run)return;frame++;speed=Math.min(speed+(nitro?1.1:.25),nitro?225:165);score+=Math.max(1,Math.floor(speed/45));$('score').textContent=score;$('speed').textContent=Math.floor(speed);curve+=(target-curve)*.008;if(Math.random()<.003)target=(Math.random()-.5)*1.5;if(++spawn>Math.max(27,75-speed*.2)){spawn=0;spawnCar()}traffic.forEach(t=>t.z+=t.v*(1+speed/150));for(let t of traffic){if(t.z>.78&&t.z<.99&&Math.abs(t.lane-x)<.34){run=false;shake=10;if(score>best){best=score;localStorage.etgBest=best;$('best').textContent=best}$('message').innerHTML='<h1>RACE OVER</h1><p>Score: '+score+'<br>Best: '+best+'<br>Try again and beat your record!</p><button id="again">RACE AGAIN</button>';$('message').style.display='block';$('again').onclick=start}}traffic=traffic.filter(t=>t.z<1.1)}
function draw(){g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}scenery();drawRoad();traffic.forEach(t=>{let r=road(t.z),w=18+t.z*48,h=34+t.z*72;car(r.mid+t.lane*r.half*.72,r.y-h*.45,w,h,t.col)});let r=road(.92);car(r.mid+x*r.half*.72,H*.84,W*.075,H*.15,'#e32636');if(run&&speed>125){g.strokeStyle='#d9f7ff55';for(let i=0;i<10;i++){let xx=Math.random()*W,yy=Math.random()*H*.7;g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+(xx-W/2)*.04,yy+35);g.stroke()}}g.restore();update();requestAnimationFrame(draw)}
let keys={};onkeydown=e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};onkeyup=e=>keys[e.key]=false;
function bind(id,k){let el=$(id),on=e=>{e.preventDefault();keys[k]=true;el.classList.add('down')},off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('down')};el.onpointerdown=on;['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,off))}
bind('left','ArrowLeft');bind('right','ArrowRight');bind('nitro',' ');
(function control(){if(run){if(keys.ArrowLeft)x-=.035;if(keys.ArrowRight)x+=.035;x=Math.max(-.9,Math.min(.9,x));nitro=keys[' ']}requestAnimationFrame(control)})();draw();
})();
</script></body></html>
