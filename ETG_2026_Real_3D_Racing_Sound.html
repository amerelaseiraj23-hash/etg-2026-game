<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ETG 2026 3D Racing</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061522;font-family:Arial;touch-action:none}canvas{display:block}#hud{position:fixed;top:10px;left:12px;right:12px;color:white;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:bold}.logo{font-size:23px;font-style:italic}.logo b{color:#ff3838}.stats{text-align:right;background:#061522aa;padding:8px;border-radius:10px;font-size:13px}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.group{display:flex;gap:12px}.btn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #fff9;background:#071827bb;color:white;font-size:25px;font-weight:bold;display:grid;place-items:center;user-select:none}.btn:active,.btn.down{background:#ffc52b;color:#111}.pedal{width:70px;height:64px;border-radius:17px;font-size:12px;background:#16b5d8;color:#061522}#cover{position:fixed;inset:0;display:grid;place-items:center;background:#02091488}.card{width:min(90vw,420px);padding:24px;text-align:center;border-radius:20px;background:#071827ed;color:white;border:1px solid #ffffff66}h1{margin:0;color:#ffd34e;font-size:34px}p{line-height:1.5;color:#d8edf7;font-size:14px}button{padding:13px 28px;border:0;border-radius:12px;background:linear-gradient(#fff07d,#ffb900);font-size:17px;font-weight:900}
</style></head><body><div id="hud"><div class="logo">ETG <b>2026</b><br><small>3D RACING</small></div><div class="stats">SCORE <span id="score">0</span><br>SPEED <span id="speed">0</span><br>BEST <span id="best">0</span></div></div><div id="controls"><div class="group"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div><div class="group"><div class="btn pedal" id="brake">BRAKE</div><div class="btn pedal" id="nitro">NITRO</div></div></div><div id="cover"><div class="card"><h1>ETG 2026</h1><h2>3D HIGHWAY RACING 🔊</h2><p>Drive your sports car, dodge traffic and use nitro to speed up.</p><button id="start">START RACE</button><p style="font-size:11px">Landscape mode recommended • Internet needed to load 3D engine</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{if(!window.THREE){document.querySelector('.card').innerHTML='3D engine failed to load. Check internet and reload.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc8f0);scene.fog=new THREE.Fog(0x8bc8f0,60,200);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);camera.position.set(0,5,11);camera.lookAt(0,1,-8);
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.insertBefore(renderer.domElement,document.body.firstChild);
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x38502e,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-8,18,8);scene.add(sun);
const M=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const grass=M(0x34733e),roadmat=M(0x303941),white=M(0xffffff),red=M(0xd92732,.35,.25),glass=M(0x17384d,.25,.3),black=M(0x101820,.5,.2),tire=M(0x080b0e),gold=M(0xffc72d,.35,.2);
function cube(p,w,h,d,ma,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);p.add(o);return o}
let ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);
let road=new THREE.Mesh(new THREE.PlaneGeometry(12,230),roadmat);road.rotation.x=-Math.PI/2;road.position.set(0,0,-85);scene.add(road);
for(let x of [-6.2,6.2])cube(scene,.35,.5,230,M(0xe5e5e5),x,.25,-85);
let dashes=[];for(let z=10;z>-210;z-=9)for(let x of [-2,2]){let d=cube(scene,.13,.03,4,white,x,.03,z);dashes.push(d)}
let trees=[];for(let i=0;i<42;i++)for(let s of [-1,1]){let t=new THREE.Group();let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,1.4,6),M(0x68452d));trunk.position.y=.7;t.add(trunk);let crown=new THREE.Mesh(new THREE.ConeGeometry(1.1,3,7),grass);crown.position.y=2.5;t.add(crown);t.position.set(s*(10+Math.random()*7),0,-i*5-10);scene.add(t);trees.push(t)}
function car(color){let g=new THREE.Group(),body=M(color,.32,.35);cube(g,1.8,.48,3.5,body,0,.72,0);cube(g,1.43,.55,1.6,glass,0,1.12,-.2);cube(g,2.15,.12,.35,black,0,1.22,1.25);for(let x of [-.95,.95])for(let z of [-1.1,1.1]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,12),tire);w.rotation.z=Math.PI/2;w.position.set(x,.43,z);g.add(w);let h=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.23,12),gold);h.rotation.z=Math.PI/2;h.position.set(x,.43,z);g.add(h)}for(let x of [-.6,.6])cube(g,.32,.12,.08,M(0xff3333),x,.83,1.78);return g}
let player=car(0xe51f32);player.position.set(0,0,5);scene.add(player);let rivals=[];
function spawn(){let o=car([0x167ee5,0xffb51c,0xe9edf1,0x20252a][Math.floor(Math.random()*4)]);o.scale.setScalar(.9);o.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-100-Math.random()*40);scene.add(o);rivals.push(o)}

let audioCtx=null,engineOsc=null,engineGain=null,nitroOsc=null,nitroGain=null;
function audioInit(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 engineOsc=audioCtx.createOscillator();engineGain=audioCtx.createGain();
 engineOsc.type='sawtooth';engineOsc.frequency.value=75;engineGain.gain.value=0;
 engineOsc.connect(engineGain);engineGain.connect(audioCtx.destination);engineOsc.start();
 nitroOsc=audioCtx.createOscillator();nitroGain=audioCtx.createGain();
 nitroOsc.type='square';nitroOsc.frequency.value=48;nitroGain.gain.value=0;
 nitroOsc.connect(nitroGain);nitroGain.connect(audioCtx.destination);nitroOsc.start();
}
function tone(freq,duration,type='sine',volume=.12){
 if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
 g.gain.setValueAtTime(volume,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
}
function startSound(){tone(440,.12);setTimeout(()=>tone(660,.18),130);setTimeout(()=>tone(880,.22),280)}
function crashSound(){if(!audioCtx)return;let len=audioCtx.sampleRate*.35,b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);let s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;g.gain.value=.32;s.connect(g);g.connect(audioCtx.destination);s.start()}
function updateAudio(){
 if(!audioCtx)return;
 let t=audioCtx.currentTime;
 engineOsc.frequency.setTargetAtTime(55+v*1.15,t,.08);
 engineGain.gain.setTargetAtTime(run?.035:0,t,.08);
 nitroOsc.frequency.setTargetAtTime(55+v*1.8,t,.06);
 nitroGain.gain.setTargetAtTime(run&&key.nitro?.045:0,t,.06);
}

let key={},run=false,score=0,best=+(localStorage.etgBest3d||0),v=35,steer=0,spawnT=0;document.getElementById('best').textContent=best;
function bind(id,k){let e=document.getElementById(id),d=x=>{x.preventDefault();key[k]=true;e.classList.add('down');if(audioCtx)tone(k==='nitro'?520:300,.045,'square',.035)},u=x=>{x.preventDefault();key[k]=false;e.classList.remove('down')};e.onpointerdown=d;['pointerup','pointercancel','pointerleave'].forEach(a=>e.addEventListener(a,u))}
bind('left','left');bind('right','right');bind('nitro','nitro');bind('brake','brake');
onkeydown=e=>{if(e.key==='ArrowLeft')key.left=true;if(e.key==='ArrowRight')key.right=true;if(e.key===' ')key.nitro=true;if(e.key==='ArrowDown')key.brake=true};onkeyup=e=>{key.left=key.right=key.nitro=key.brake=false};
function start(){audioInit();if(audioCtx.state==='suspended')audioCtx.resume();startSound();score=0;v=35;player.position.x=0;rivals.forEach(o=>scene.remove(o));rivals=[];spawnT=0;run=true;document.getElementById('cover').style.display='none'}
document.getElementById('start').onclick=start;
function finish(){if(!run)return;crashSound();run=false;if(score>best){best=score;localStorage.etgBest3d=best;document.getElementById('best').textContent=best}document.querySelector('.card').innerHTML='<h1>RACE OVER</h1><h2>Score '+score+'</h2><p>Best '+best+'</p><button id="again">RACE AGAIN</button>';document.getElementById('cover').style.display='grid';document.getElementById('again').onclick=start}
let clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);if(run){updateAudio();let boost=key.nitro?1.6:1;v=Math.max(0,Math.min(230,v+(key.brake?-75:key.nitro?60:15)*dt));let si=(key.right?1:0)-(key.left?1:0);steer+=(si-steer)*Math.min(1,dt*6);player.position.x=THREE.MathUtils.clamp(player.position.x+steer*dt*(3+v*.018),-4.6,4.6);player.rotation.z=-steer*.1;player.rotation.y=-steer*.07;let move=v/3.6*dt*boost;dashes.forEach(o=>{o.position.z+=move;if(o.position.z>12)o.position.z-=216});trees.forEach(o=>{o.position.z+=move;if(o.position.z>14)o.position.z-=220});spawnT+=dt;if(spawnT>1.35&&rivals.length<7){spawnT=0;spawn()}rivals.forEach(o=>{o.position.z+=move*.75;if(o.position.z>12){o.position.z=-130-Math.random()*30;o.position.x=[-4,0,4][Math.floor(Math.random()*3)]}if(Math.abs(o.position.z-player.position.z)<2.5&&Math.abs(o.position.x-player.position.x)<1.55)finish()});score+=Math.floor(v*dt*.18);document.getElementById('score').textContent=score;document.getElementById('speed').textContent=Math.round(v);camera.position.x+=(player.position.x*.25-camera.position.x)*dt*2;camera.lookAt(player.position.x*.2,1,-9)}renderer.render(scene,camera)}
loop();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))};
})();
</script></body></html>
